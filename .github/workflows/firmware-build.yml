name: Build ESP32 Firmware

on:
  push:
    branches: [ main, master ]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile ESP32 Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Board Core & Libraries
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install ArduinoJson

      - name: Compile Arduino Sketch
        working-directory: ./firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --output-dir ./build .

      - name: Upload Firmware Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-labelprinter-firmware
          path: ./firmware/build/*.bin

      - name: Attach Firmware to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./firmware/build/*.bin
          generate_release_notes: true
