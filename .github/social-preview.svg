  <text x="80" y="190" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="32" font-weight="500">spelech /</text>
  <text x="80" y="264" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">NelkoP21WebPrint</text>

