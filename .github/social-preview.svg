<text x="80" y="378" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400">label design engine for Nelko P21 &amp; ESC/POS Bluetooth</text>
<text x="80" y="420" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400">printers.</text>

