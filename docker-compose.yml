version: '3.8'

services:
  nelko-p21-print:
    image: ghcr.io/spelech/nelkop21webprint:latest
    # Uncomment line below if you want to build locally instead of pulling from GHCR:
    # build: .
    container_name: nelko-p21-print
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PRINTER_DRIVER=${PRINTER_DRIVER:-tcp}
      - PRINTER_TCP_HOST=${PRINTER_TCP_HOST:-192.168.1.50}
      - PRINTER_TCP_PORT=${PRINTER_TCP_PORT:-9100}
      - PRINTER_BT_MAC=${PRINTER_BT_MAC:-}
    # For Direct Bluetooth SPP access on Linux hosts, uncomment below:
    # network_mode: "host"
    # privileged: true
    # volumes:
    #   - /var/run/dbus:/var/run/dbus
    #   - /dev/rfcomm0:/dev/rfcomm0
